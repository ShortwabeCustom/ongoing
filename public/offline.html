<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#052b20" />
    <title>Pruebas Maria 2.0 · Sin conexion</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #052b20;
        color: #f4faf7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 520px;
      }

      h1 {
        font-size: clamp(28px, 6vw, 44px);
        line-height: 1.05;
        margin: 0 0 16px;
      }

      p {
        color: #c9ddd5;
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 24px;
      }

      a {
        color: #052b20;
        background: #f4faf7;
        border-radius: 8px;
        display: inline-block;
        font-weight: 700;
        padding: 12px 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexion</h1>
      <p>
        No se pudo cargar esta vista. El reporte offline y los recursos ya
        guardados seguiran disponibles cuando hayan sido cacheados en este
        dispositivo.
      </p>
      <a href="/app.html">Abrir reporte offline</a>
    </main>
  </body>
</html>
