name: Validate Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pruebas_maria_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q cluster_name"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9200:9200

    env:
      # DATABASE_URL/ELASTICSEARCH_URL: apuntan a los contenedores de servicio efímeros
      # definidos arriba (solo viven durante este job); no son credenciales de producción.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pruebas_maria_ci?schema=public
      ELASTICSEARCH_URL: http://localhost:9200
      # P0-B (2026-08-17): AUTH_SECRET y las credenciales S3 eran literales en el working
      # tree (aunque de CI, no de producción); se sustituyen por GitHub Secrets.
      AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET }}
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: ci-evidence
      S3_ACCESS_KEY_ID: ${{ secrets.CI_S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.CI_S3_SECRET_ACCESS_KEY }}
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm exec -- prisma generate

      - name: Legacy lint debt (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Lint changed JavaScript and TypeScript
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$LINT_BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse HEAD^)"
          fi
          mapfile -d '' files < <(git diff --diff-filter=ACMR --name-only -z "$base" "$GITHUB_SHA" -- '*.js' '*.cjs' '*.mjs' '*.ts' '*.tsx')
          if ((${#files[@]})); then
            npm exec -- eslint -- "${files[@]}"
          fi

      - name: Run tests
        run: npm test

      - name: Run database migrations
        run: npm exec -- prisma migrate deploy
        env:
          NODE_ENV: production

      - name: Verify Prisma schema drift
        run: >-
          npm exec -- prisma migrate diff
          --exit-code
          --from-config-datasource
          --to-schema prisma/schema.prisma

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check Elasticsearch indices
        run: |
          curl -s -X GET "http://localhost:9200/_cat/indices" || echo "ES may need index initialization"

      - name: Notify validation
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Pruebas María release validation: ${{ job.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        continue-on-error: true
